<div class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <div class="w-72 bg-white border-r border-gray-200 h-screen flex flex-col shadow-sm">
    <!-- Logo/Header -->
    <div class="p-6 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#5B52FF] rounded-xl flex items-center justify-center shadow-lg">
          <!-- Heart icon -->
          <svg class="w-5 h-5 text-white fill-white" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-900">Solidari-Health</h1>
          <p class="text-xs text-gray-500">Admin Dashboard</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
      <ng-container *ngFor="let item of menuItems">
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-gradient-to-br from-[#5B52FF] to-[#4B42EF] text-white shadow-lg"
          [routerLinkActiveOptions]="{exact: true}"
          #rla="routerLinkActive"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-700 hover:bg-gray-50"
        >
          <div class="p-2 rounded-lg" [ngClass]="rla.isActive ? 'bg-white/20' : 'bg-gray-100'">
            <!-- Dashboard Icon -->
            <svg *ngIf="item.icon === 'dashboard'" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            <!-- User Check Icon -->
            <svg *ngIf="item.icon === 'userCheck'" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
            <!-- Users Icon -->
            <svg *ngIf="item.icon === 'users'" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <!-- Clipboard List Icon -->
            <svg *ngIf="item.icon === 'clipboardList'" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
            <!-- Hospital Icon -->
            <svg *ngIf="item.icon === 'hospital'" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 10h8"/><path d="M12 6v8"/><path d="M10 20v-4h4v4"/></svg>
            <!-- Bar Chart Icon -->
            <svg *ngIf="item.icon === 'barChart'" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="10" width="4" height="7"/><rect x="14" y="5" width="4" height="12"/></svg>
            <!-- Activity Icon -->
            <svg *ngIf="item.icon === 'activity'" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>

          <div class="flex-1 text-left">
            <div class="text-sm font-semibold">{{ item.label }}</div>
            <div *ngIf="item.subtitle" class="text-xs" [ngClass]="rla.isActive ? 'text-white/80' : 'text-gray-500'">{{ item.subtitle }}</div>
          </div>
        </a>
      </ng-container>
    </nav>

    <!-- User Info -->
    <div class="p-4 border-t border-gray-200">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[#5B52FF] to-[#4B42EF] flex items-center justify-center shadow-lg">
          <span class="text-sm font-semibold text-white">AD</span>
        </div>
        <div class="flex-1">
          <div class="text-sm font-semibold text-gray-900">Admin User</div>
          <div class="text-xs text-gray-500">admin@solidari.health</div>
        </div>
      </div>
      <a routerLink="/admin/welcome" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors text-sm font-medium">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </a>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>
</div>
