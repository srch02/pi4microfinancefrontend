<div class="min-h-screen flex flex-col p-6">
      <div class="mb-6">
        <a routerLink="/verify-cin" class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Back</a>
        <div class="mb-4"><div class="flex items-center justify-between text-sm text-gray-600 mb-2"><span>Step 2 of 4</span><span>50%</span></div><div class="w-full bg-gray-200 rounded-full h-2"><div class="bg-indigo-600 h-2 rounded-full w-1/2"></div></div></div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Medical History Declaration</h1>
        <p class="text-gray-600">Help us calculate your personalized price</p>
      </div>
      <div class="max-w-2xl mx-auto w-full flex-1 flex flex-col">
        <div class="space-y-8 flex-1">
          <div><h3 class="font-semibold text-gray-900 mb-4">Current Health Conditions</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><button *ngFor="let c of currentConditions" (click)="toggleCondition(c, 'currentConditions')" class="p-4 rounded-xl border-2 text-left transition-all" [ngClass]="formData.currentConditions.includes(c) ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200 hover:border-indigo-300'"><div class="flex items-center gap-3"><div class="w-5 h-5 rounded border-2 flex items-center justify-center" [ngClass]="formData.currentConditions.includes(c) ? 'border-indigo-600 bg-indigo-600' : 'border-gray-300'"><svg *ngIf="formData.currentConditions.includes(c)" class="w-3 h-3 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4 10-10"/></svg></div><span class="text-sm font-medium text-gray-900">{{ c }}</span></div></button></div></div>
          <div><h3 class="font-semibold text-gray-900 mb-4">Family Medical History</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><button *ngFor="let c of familyConditions" (click)="toggleCondition(c, 'familyHistory')" class="p-4 rounded-xl border-2 text-left transition-all" [ngClass]="formData.familyHistory.includes(c) ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200 hover:border-indigo-300'"><div class="flex items-center gap-3"><div class="w-5 h-5 rounded border-2 flex items-center justify-center" [ngClass]="formData.familyHistory.includes(c) ? 'border-indigo-600 bg-indigo-600' : 'border-gray-300'"><svg *ngIf="formData.familyHistory.includes(c)" class="w-3 h-3 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4 10-10"/></svg></div><span class="text-sm font-medium text-gray-900">{{ c }}</span></div></button></div></div>
          <div><label class="block font-semibold text-gray-900 mb-2">Ongoing Treatments (if any)</label><textarea [(ngModel)]="formData.ongoingTreatments" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0 resize-none" rows="3" placeholder="List any medications or treatments you're currently receiving..."></textarea></div>
          <div><label class="block font-semibold text-gray-900 mb-2">Past Consultation Frequency</label><select [(ngModel)]="formData.consultationFrequency" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0"><option value="never">Never or rarely</option><option value="1-2">1-2 times per year</option><option value="3-5">3-5 times per year</option><option value="monthly">Monthly or more</option></select></div>
        </div>
        <button type="button" (click)="handleSubmit()" class="mt-8 block w-full bg-indigo-600 text-white py-4 rounded-xl font-semibold text-lg text-center hover:bg-indigo-700 transition-colors">Continue</button>
      </div>
    </div>
