<div class="min-h-screen flex flex-col p-6 pb-12">
      <div class="max-w-2xl w-full mx-auto">
        <a routerLink="/waiting-approval" class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Back
        </a>
        <div class="mb-4">
          <div class="flex items-center justify-between text-sm text-gray-600 mb-2">
            <span>Step 3 of 4</span>
            <span>75%</span>
          </div>
          <div class="w-full bg-gray-200 rounded-full h-2">
            <div class="bg-indigo-600 h-2 rounded-full w-3/4 transition-all duration-300"></div>
          </div>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Complete Your Profile</h1>
        <p class="text-gray-600 mb-8">Help us personalize your insurance experience</p>

        <div class="space-y-6 mb-8">
          <div class="bg-white rounded-2xl border border-gray-200 p-6">
            <div class="flex items-center gap-2 mb-4">
              <div class="w-9 h-9 rounded-lg bg-indigo-100 flex items-center justify-center">
                <svg class="w-5 h-5 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10"/><path d="M7 12h6"/></svg>
              </div>
              <h2 class="font-semibold text-gray-900">Member Details (Backend)</h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-900 mb-2">CIN Number <span class="text-red-500">*</span></label>
                <input [(ngModel)]="profile.cinNumber" type="text" placeholder="12345678" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-900 mb-2">Age</label>
                <input [(ngModel)]="profile.age" type="number" placeholder="28" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-900 mb-2">Profession</label>
                <input [(ngModel)]="profile.profession" type="text" placeholder="student / worker" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-900 mb-2">Region</label>
                <input [(ngModel)]="profile.region" type="text" placeholder="Tunis" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
              </div>
            </div>
            <p class="text-xs text-gray-500 mt-3">
              These fields map to Spring <code class="px-1 rounded bg-gray-100">POST /api/members</code>. Other UI fields below are for your future profile API.
            </p>
          </div>

          <div class="bg-white rounded-2xl border border-gray-200 p-6">
            <div class="flex items-center gap-2 mb-4">
              <div class="w-9 h-9 rounded-lg bg-blue-100 flex items-center justify-center">
                <svg class="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>
              </div>
              <h2 class="font-semibold text-gray-900">Personal Information</h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-900 mb-2">Full Name <span class="text-red-500">*</span></label>
                <input [(ngModel)]="profile.fullName" type="text" placeholder="John Doe" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-900 mb-2">Date of Birth <span class="text-red-500">*</span></label>
                <input [(ngModel)]="profile.dateOfBirth" type="text" placeholder="jj/mm/aaaa" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-900 mb-2">Gender <span class="text-red-500">*</span></label>
                <select [(ngModel)]="profile.gender" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0">
                  <option value="">Select gender</option>
                  <option value="female">Female</option>
                  <option value="male">Male</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-gray-200 p-6">
            <div class="flex items-center gap-2 mb-4">
              <div class="w-9 h-9 rounded-lg bg-blue-100 flex items-center justify-center">
                <svg class="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </div>
              <h2 class="font-semibold text-gray-900">Contact Information</h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-900 mb-2">Email Address</label>
                <input [(ngModel)]="profile.email" type="email" placeholder="john.doe@example.com" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-900 mb-2">Phone Number <span class="text-red-500">*</span></label>
                <input [(ngModel)]="profile.phone" type="text" placeholder="+221 77 123 45 67" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-900 mb-2">Alternate Phone</label>
                <input [(ngModel)]="profile.altPhone" type="text" placeholder="+221 76 234 56 78" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
              </div>
            </div>
          </div>
        </div>

        <div *ngIf="error" class="mb-6 bg-red-50 border border-red-200 text-red-800 rounded-xl p-4 text-sm">
          {{ error }}
        </div>

        <button
          type="button"
          (click)="continueToGroupSelection()"
          [disabled]="creating"
          class="w-full py-4 rounded-xl font-semibold text-lg transition-colors"
          [ngClass]="creating ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700'"
        >
          {{ creating ? 'Creating member...' : 'Continue to Group Selection' }}
        </button>
      </div>
    </div>
