<div class="min-h-screen flex flex-col p-6">
      <div class="mb-8">
        <a routerLink="/calculating" class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Back</a>
        <div class="text-center mb-4">
          <h1 class="text-2xl font-bold text-gray-900 mb-2">Your Personalized Price</h1>
          <div class="inline-flex items-baseline gap-1 mb-2">
            <span class="text-5xl font-bold text-indigo-600">{{ basePrice }}</span>
            <span class="text-2xl text-gray-600">DT/month</span>
          </div>
          <p class="text-gray-600">Based on your health profile</p>
        </div>
      </div>

      <div class="max-w-5xl mx-auto w-full flex-1">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div
            *ngFor="let plan of plans"
            (click)="selectedPlan = plan.id"
            class="relative bg-white rounded-2xl border-2 p-6 cursor-pointer transition-all hover:shadow-lg"
            [ngClass]="selectedPlan === plan.id ? getColorClasses(plan.color) : 'border-gray-200 hover:border-gray-300'"
          >
            <div *ngIf="plan.popular" class="absolute -top-3 left-1/2 transform -translate-x-1/2">
              <span class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-4 py-1 rounded-full text-xs font-semibold">MOST POPULAR</span>
            </div>

            <div
              class="w-14 h-14 rounded-xl flex items-center justify-center mb-4 text-2xl"
              [ngClass]="plan.color === 'indigo' ? 'bg-indigo-100 text-indigo-600' : (plan.color === 'blue' ? 'bg-blue-100 text-blue-600' : 'bg-purple-100 text-purple-600')"
            >
              <svg *ngIf="plan.icon === 'shield'" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 5 6v6c0 5 3.5 8 7 9 3.5-1 7-4 7-9V6l-7-3z"/></svg>
              <svg *ngIf="plan.icon === 'star'" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.9 5.9 6.6 1-4.8 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.5 9.9l6.6-1z"/></svg>
              <svg *ngIf="plan.icon === 'zap'" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
            </div>

            <h3 class="text-xl font-bold text-gray-900 mb-2">{{ plan.name }}</h3>
            <div class="mb-4">
              <div class="flex items-baseline gap-1">
                <span class="text-3xl font-bold text-gray-900">{{ plan.price }}</span>
                <span class="text-gray-600">DT/mo</span>
              </div>
              <p *ngIf="plan.adjustment > 0" class="text-sm text-gray-500">Base +{{ plan.adjustment }}%</p>
            </div>
            <ul class="space-y-3 mb-6">
              <li *ngFor="let feature of plan.features" class="flex items-start gap-2 text-sm text-gray-700">
                <svg class="w-4 h-4 text-emerald-600 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-9"/></svg>
                <span>{{ feature }}</span>
              </li>
            </ul>
            <button
              type="button"
              class="w-full py-3 rounded-xl font-semibold transition-colors"
              [ngClass]="selectedPlan === plan.id ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-900 hover:bg-gray-200'"
            >
              {{ selectedPlan === plan.id ? 'Selected' : 'Select Plan' }}
            </button>
          </div>
        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6">
          <p class="text-sm text-blue-900">
            <strong>Price Guarantee:</strong> Your monthly premium will stay stable for 12 months, regardless of health changes.
          </p>
        </div>

        <button
          type="button"
          (click)="continueWithPlan()"
          [disabled]="!selectedPlan"
          class="w-full py-4 rounded-xl font-semibold text-lg transition-colors"
          [ngClass]="selectedPlan ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-gray-300 text-gray-500 cursor-not-allowed'"
        >
          Continue with {{ selectedPlanName || 'Selected' }} Plan
        </button>
      </div>
    </div>
