<div class="flex flex-col h-screen bg-gradient-to-br from-indigo-50 via-white to-blue-50">
      <header class="bg-white border-b border-gray-200 px-6 py-4">
        <div class="flex items-center justify-between max-w-7xl mx-auto">
          <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-indigo-600" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="m11.995 21.35-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09A6.04 6.04 0 0 1 16.5 3C19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/>
            </svg>
            <div>
              <h1 class="font-bold text-gray-900">Solidari-<span class="text-indigo-600">Health</span></h1>
              <p class="text-xs text-gray-500">Welcome back, Member!</p>
            </div>
          </div>
          <div class="relative">
            <button
              type="button"
              (click)="toggleProfileMenu($event)"
              class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center border border-indigo-200"
              aria-label="Open profile menu"
            >
              <span class="text-sm font-semibold text-indigo-600">{{ initials }}</span>
            </button>
            <div
              *ngIf="profileMenuOpen"
              (click)="$event.stopPropagation()"
              class="absolute right-0 mt-2 w-72 rounded-2xl border border-gray-200 bg-white shadow-lg z-30 overflow-hidden"
            >
              <div class="p-4 border-b border-gray-100">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-semibold">
                    {{ initials }}
                  </div>
                  <div class="min-w-0">
                    <p class="font-semibold text-gray-900 truncate">{{ user.name }}</p>
                    <p class="text-xs text-gray-500 truncate">{{ user.email }}</p>
                  </div>
                </div>
                <div class="mt-3 flex items-center justify-between">
                  <p class="text-xs text-gray-500">Member ID: {{ user.memberId }}</p>
                  <span class="text-xs px-2 py-1 rounded-full bg-indigo-100 text-indigo-700 font-medium">{{ user.plan }}</span>
                </div>
              </div>
              <nav class="p-2 text-sm">
                <a [routerLink]="['profile']" [relativeTo]="memberRoute" class="block px-3 py-2 rounded-lg hover:bg-gray-50 text-gray-700">My Profile</a>
                <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-50 text-gray-700">Settings</a>
                <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-50 text-gray-700">Privacy & Security</a>
                <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-50 text-gray-700">My Plan & Coverage</a>
              </nav>
              <div class="p-2 border-t border-gray-100">
                <button type="button" (click)="logout()" class="w-full text-left px-3 py-2 rounded-lg text-red-600 hover:bg-red-50 font-medium">
                  Log Out
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-auto pb-20">
        <router-outlet></router-outlet>
      </main>

      <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">
        <div class="flex items-center justify-around px-2 py-2 max-w-lg mx-auto">
          <a [routerLink]="['']" [relativeTo]="memberRoute" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="text-indigo-600" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
            <span class="text-xs font-medium">Home</span>
          </a>
          <a [routerLink]="['submit-claim']" [relativeTo]="memberRoute" routerLinkActive="text-indigo-600" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16l4-3h8a2 2 0 0 0 2-2V6z"/><path d="M14 2v4h4"/></svg>
            <span class="text-xs font-medium">Claims</span>
          </a>
          <a [routerLink]="['health']" [relativeTo]="memberRoute" routerLinkActive="text-indigo-600" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 2v4"/><path d="M19 2v4"/><path d="M12 21V8"/><path d="M8 12h8"/><path d="M9 2h6"/><path d="M7 6h10"/></svg>
            <span class="text-xs font-medium">Health</span>
          </a>
          <a [routerLink]="['group-chat']" [relativeTo]="memberRoute" routerLinkActive="text-indigo-600" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="text-xs font-medium">Chat</span>
          </a>
          <a [routerLink]="['rewards']" [relativeTo]="memberRoute" routerLinkActive="text-indigo-600" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="m8.2 13.5-1.3 7 5.1-3 5.1 3-1.3-7"/></svg>
            <span class="text-xs font-medium">Rewards</span>
          </a>
        </div>
      </nav>
      <button
        type="button"
        class="fixed bottom-24 right-4 z-20 w-12 h-12 rounded-full bg-gray-900 text-white text-xl font-bold shadow-lg hover:bg-gray-800 transition-colors"
        aria-label="Help"
      >
        ?
      </button>
    </div>
