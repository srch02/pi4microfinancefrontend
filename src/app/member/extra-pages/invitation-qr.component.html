<div class="p-6 max-w-md mx-auto text-center">
      <h1 class="text-2xl font-bold mb-2">Invitation QR</h1>
      <p class="text-gray-600 mb-8">Share this QR to invite members to your group.</p>
      <div class="bg-white rounded-2xl border-4 border-indigo-600 p-8 mb-6">
        <div class="mx-auto h-56 w-56 rounded-xl border-8 border-gray-900 bg-[repeating-linear-gradient(45deg,#111_0,#111_8px,#fff_8px,#fff_16px)]"></div>
        <p class="text-sm text-gray-600 mt-4">Invite Code: {{ qr.code }}</p>
      </div>
      <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-4 text-left">
        <p class="text-sm text-indigo-900 font-medium mb-1">Expires: {{ qr.expiresAt }}</p>
        <p class="text-sm text-indigo-700">Total invites used: {{ qr.invitedCount }}</p>
      </div>
    </div>
