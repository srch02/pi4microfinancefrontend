<div class="h-[calc(100vh-140px)] grid grid-cols-[280px_1fr] bg-white border border-gray-200 rounded-xl overflow-hidden">
      <aside class="border-r border-gray-200 bg-gray-50">
        <div class="p-4">
          <h2 class="text-2xl font-bold text-gray-900 mb-3">Group Chat</h2>
          <input type="search" placeholder="Search members..." class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:border-indigo-500 focus:ring-0" />
        </div>
        <div class="overflow-auto h-[calc(100%-84px)]">
          <button
            type="button"
            *ngFor="let member of members"
            (click)="selectedMember = member.id"
            class="w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-white transition-colors border-b border-gray-100"
            [ngClass]="selectedMember === member.id ? 'bg-white' : ''"
          >
            <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-semibold">{{ member.initials }}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between">
                <p class="font-semibold text-gray-900 truncate">{{ member.name }}</p>
                <p class="text-xs text-gray-400">{{ member.time }}</p>
              </div>
              <p class="text-xs text-gray-500 truncate">{{ member.preview }}</p>
            </div>
          </button>
        </div>
      </aside>
      <section class="relative">
        <div *ngIf="!selectedMember" class="h-full flex items-center justify-center text-center text-gray-500">
          <div>
            <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4">
              <svg class="w-8 h-8 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>
            </div>
            <h3 class="text-3xl font-semibold text-gray-800 mb-2">Select a Member to Chat</h3>
            <p class="text-sm">Choose a group member from the list to start a private conversation</p>
          </div>
        </div>
        <div *ngIf="selectedMember" class="h-full flex flex-col">
          <div class="px-4 py-3 border-b border-gray-200 font-semibold text-gray-900">{{ currentMemberName }}</div>
          <div class="flex-1 overflow-auto p-4 space-y-3 bg-gray-50">
            <div
              *ngFor="let message of messages"
              class="rounded-xl px-4 py-3 max-w-[75%]"
              [ngClass]="message.sender === 'member' ? 'bg-indigo-600 text-white ml-auto' : 'bg-white text-gray-900 border border-gray-200'"
            >
              <p class="text-sm">{{ message.text }}</p>
              <p class="text-xs mt-1 opacity-70">{{ message.time }}</p>
            </div>
          </div>
          <div class="p-3 border-t border-gray-200 flex gap-2">
            <input [(ngModel)]="draft" type="text" placeholder="Write a message..." class="flex-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-indigo-600 focus:ring-0" />
            <button type="button" (click)="send()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors">Send</button>
          </div>
        </div>
      </section>
    </div>
