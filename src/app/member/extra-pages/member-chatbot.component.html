<div class="p-6 max-w-2xl mx-auto">
      <h1 class="text-2xl font-bold mb-2">Health Assistant</h1>
      <p class="text-gray-600 mb-6">Ask questions about claims, plans, and coverage.</p>
      <div class="flex flex-wrap gap-2 mb-4">
        <button
          *ngFor="let action of quickActions"
          type="button"
          (click)="apply(action)"
          class="px-3 py-2 rounded-full text-sm bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 transition-colors"
        >
          {{ action.label }}
        </button>
      </div>
      <div class="bg-white rounded-2xl border border-gray-200 p-4 space-y-3 mb-4 min-h-[260px]">
        <div *ngFor="let message of conversation" class="rounded-xl px-4 py-3 text-sm" [ngClass]="message.sender === 'bot' ? 'bg-indigo-50 text-indigo-900' : 'bg-gray-100 text-gray-900'">
          {{ message.text }}
        </div>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-3 flex gap-2">
        <input [(ngModel)]="prompt" type="text" placeholder="Ask the assistant..." class="flex-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-indigo-600 focus:ring-0" />
        <button type="button" (click)="ask()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors">Ask</button>
      </div>
    </div>
