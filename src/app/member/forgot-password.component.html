<div class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-br from-indigo-50 via-white to-blue-50">
      <div class="w-full max-w-md">
        <button type="button" routerLink="/sign-in" class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Back to login
        </button>
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
          <h1 class="text-2xl font-bold text-gray-900 mb-1">Forgot Password</h1>
          <p class="text-gray-600 mb-6">Step {{ step }} of 3</p>

          <div *ngIf="step === 1" class="space-y-4">
            <label class="block text-sm font-medium text-gray-900">Email address</label>
            <input [(ngModel)]="email" type="email" placeholder="you@example.com" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
            <button type="button" (click)="sendCode()" [disabled]="busy || !email.trim()" class="w-full py-3 rounded-xl font-semibold" [ngClass]="busy || !email.trim() ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700'">
              {{ busy ? 'Sending...' : 'Send verification code' }}
            </button>
          </div>

          <div *ngIf="step === 2" class="space-y-4">
            <p class="text-sm text-gray-600">Enter the 6-digit code sent to <strong>{{ email }}</strong></p>
            <div class="flex items-center justify-between gap-2">
              <input
                #codeInput
                *ngFor="let d of codeDigits; let i = index"
                maxlength="1"
                inputmode="numeric"
                [value]="codeDigits[i]"
                (input)="onCodeInput(i, $any($event.target).value)"
                (keydown)="onCodeKeydown(i, $event)"
                class="w-11 h-12 text-center text-lg font-semibold border-2 border-gray-200 rounded-lg focus:border-indigo-600 focus:ring-0"
              />
            </div>
            <button type="button" (click)="verifyCode()" [disabled]="busy || codeValue.length !== 6" class="w-full py-3 rounded-xl font-semibold" [ngClass]="busy || codeValue.length !== 6 ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700'">
              {{ busy ? 'Verifying...' : 'Verify code' }}
            </button>
            <button type="button" (click)="resendCode()" [disabled]="busy" class="w-full text-sm text-indigo-600 hover:underline">
              Resend code
            </button>
          </div>

          <div *ngIf="step === 3" class="space-y-4">
            <label class="block text-sm font-medium text-gray-900">New password</label>
            <input [(ngModel)]="password" type="password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
            <label class="block text-sm font-medium text-gray-900">Confirm password</label>
            <input [(ngModel)]="confirmPassword" type="password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:ring-0" />
            <p *ngIf="password && password.length < 8" class="text-sm text-amber-700">Password must contain at least 8 characters.</p>
            <button type="button" (click)="resetPassword()" [disabled]="busy || !canReset" class="w-full py-3 rounded-xl font-semibold" [ngClass]="busy || !canReset ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700'">
              {{ busy ? 'Updating...' : 'Reset password' }}
            </button>
          </div>

          <p *ngIf="errorMessage" class="mt-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">{{ errorMessage }}</p>
          <p *ngIf="infoMessage" class="mt-4 text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg p-3">{{ infoMessage }}</p>
        </div>
      </div>
    </div>
