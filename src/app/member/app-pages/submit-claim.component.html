<div class="p-6 max-w-2xl mx-auto">
      <a routerLink=".." class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Back</a>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Submit New Claim</h1>
      <div class="flex items-center gap-2 mb-4">
        <div *ngFor="let s of steps" class="flex items-center flex-1">
          <div class="h-2 rounded-full flex-1" [ngClass]="s <= step ? 'bg-indigo-600' : 'bg-gray-200'"></div>
        </div>
      </div>
      <p class="text-sm text-gray-600 mb-6">Step {{ step }} of 3</p>
      <div *ngIf="step === 1" class="space-y-6">
        <div><label class="block text-sm font-medium text-gray-900 mb-2">Expense Type *</label><select [(ngModel)]="formData.expenseType" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"><option value="">Select expense type</option><option>Consultation</option><option>Medication</option><option>Lab Test</option><option>Minor Procedure</option><option>Emergency Care</option></select></div>
        <div><label class="block text-sm font-medium text-gray-900 mb-2">Amount (DT) *</label><input [(ngModel)]="formData.amount" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl" /></div>
        <div><label class="block text-sm font-medium text-gray-900 mb-2">Description *</label><textarea [(ngModel)]="formData.description" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl resize-none" rows="4"></textarea></div>
        <button (click)="step=2" class="w-full py-4 rounded-xl font-semibold bg-indigo-600 text-white">Continue to Documents</button>
      </div>
      <div *ngIf="step === 2" class="space-y-6">
        <div class="border-2 border-dashed border-gray-300 rounded-2xl p-8 text-center"><p class="font-medium text-gray-900 mb-2">Take Photo of Invoice</p><p class="text-sm text-gray-600 mb-4">or drag and drop a file</p></div>
        <div class="flex gap-3"><button (click)="step=1" class="flex-1 py-4 border-2 border-gray-300 text-gray-700 font-semibold rounded-xl">Back</button><button (click)="step=3" class="flex-1 py-4 bg-indigo-600 text-white font-semibold rounded-xl">Continue to Review</button></div>
      </div>
      <div *ngIf="step === 3" class="space-y-6">
        <div class="bg-gradient-to-r from-indigo-600 to-blue-600 rounded-2xl p-6 text-white"><h3 class="text-lg font-semibold mb-2">Trust Score</h3><div class="text-5xl font-bold">{{ score }}</div><p class="text-indigo-100">out of 100</p></div>
        <button (click)="submitClaim()" class="w-full py-4 bg-emerald-600 text-white font-semibold rounded-xl">Submit Claim</button>
      </div>
    </div>
