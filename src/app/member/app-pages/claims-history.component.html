<div class="p-6 max-w-2xl mx-auto">
      <a routerLink=".." class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Back</a>
      <h1 class="text-2xl font-bold mb-6">Claims History</h1>
      <div class="space-y-4">
        <div *ngFor="let claim of claims" class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="flex justify-between items-start mb-2">
            <div><p class="font-semibold text-gray-900">{{ claim.type }}</p><p class="text-sm text-gray-500">{{ claim.id }} • {{ claim.date }}</p></div>
            <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium" [ngClass]="claim.status === 'approved' ? 'bg-emerald-100 text-emerald-800' : claim.status === 'pending' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'">{{ claim.status }}</span>
          </div>
          <div class="flex justify-between items-center"><span class="text-lg font-bold text-gray-900">{{ claim.amount }} DT</span><span class="text-sm text-gray-600">Score: {{ claim.score }}/100</span></div>
        </div>
      </div>
    </div>
